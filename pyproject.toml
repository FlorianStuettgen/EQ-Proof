[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-proof"
version = "1.0.0"
description = "Offline constraint repair with minimal-change projection and verifiable proof artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Florian Stuettgen" }]
keywords = ["constraints", "optimization", "attestation", "audit", "data-quality"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=42",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
eq-proof = "eq_proof.cli:main"

[project.urls]
Repository = "https://github.com/FlorianStuettgen/EQ-Proof"
Issues = "https://github.com/FlorianStuettgen/EQ-Proof/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["eq_proof"]
omit = ["src/eq_proof/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
