[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-proof"
version = "1.5.0"
description = "Local-first project-controls equation workbench and evidence control room"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Florian Stuettgen" }]
keywords = ["project-controls", "primavera-p6", "earned-value", "forecasting", "lineage", "attestation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Security :: Cryptography"
]
dependencies = [
  "cryptography>=42",
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4.21", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.12", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.12"]

[project.scripts]
eq-proof = "eq_proof.cli:main"
eq-controls = "eq_proof.controls_cli:main"

[project.urls]
Repository = "https://github.com/FlorianStuettgen/EQ-Proof"
Documentation = "https://github.com/FlorianStuettgen/EQ-Proof/tree/main/docs"
Issues = "https://github.com/FlorianStuettgen/EQ-Proof/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eq_proof = ["web/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["eq_proof"]
omit = ["src/eq_proof/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 92
