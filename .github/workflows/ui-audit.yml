name: ui-audit

on:
  pull_request:
    paths:
      - "src/eq_proof/web/**"
      - "tests/ui/**"
      - "tests/browser-engine.test.js"
      - "package.json"
      - "playwright.config.js"
      - ".github/workflows/ui-audit.yml"
  push:
    branches: [main]
    paths:
      - "src/eq_proof/web/**"
      - "tests/ui/**"
      - "tests/browser-engine.test.js"
      - "package.json"
      - "playwright.config.js"
      - ".github/workflows/ui-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    name: Functional UI, responsive, and accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install audit dependencies
        run: npm install --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test browser analysis engine
        run: npm run test:browser-engine

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser audit
        run: npm run test:ui

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eq-proof-ui-audit
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
