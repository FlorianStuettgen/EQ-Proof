name: ui-audit

on:
  pull_request:
    paths:
      - "src/eq_proof/web/**"
      - "tests/ui/**"
      - "tests/browser-engine.test.js"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/ui-audit.yml"
  push:
    branches: [main]
    paths:
      - "src/eq_proof/web/**"
      - "tests/ui/**"
      - "tests/browser-engine.test.js"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/ui-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    name: Functional UI, responsive, and accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked audit dependencies
        run: |
          mkdir -p build/diagnostics
          npm ci --no-audit --no-fund 2>&1 | tee build/diagnostics/npm-ci.txt

      - name: Capture dependency audit
        id: dependency-audit
        continue-on-error: true
        run: npm audit --json > build/diagnostics/npm-audit.json

      - name: Test browser analysis engine
        run: npm run test:browser-engine

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser audit
        run: npm run test:ui

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eq-proof-ui-audit
          path: |
            playwright-report
            test-results
            build/diagnostics/npm-ci.txt
            build/diagnostics/npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce high-severity dependency audit
        if: steps.dependency-audit.outcome == 'failure'
        run: npm audit --audit-level=high
