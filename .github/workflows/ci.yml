name: repository-proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Test with branch coverage
        run: python -m pytest --cov=eq_proof --cov-report=term-missing --cov-report=xml
      - name: Compile all modules
        run: python -m compileall -q src
      - name: Validate browser JavaScript
        run: |
          node --check src/eq_proof/web/app.js
          node --check src/eq_proof/web/renderers.js
          node --check src/eq_proof/web/workflow.js
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist

  evidence:
    name: Reproducible evidence and operational scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Regenerate authoritative evidence
        run: |
          python scripts/regenerate_evidence.py
          python scripts/regenerate_control_room_demo.py
          git diff --exit-code
      - name: Exercise signed proof workflow
        run: |
          mkdir -p /tmp/eq-proof
          eq-proof keygen --private-key /tmp/eq-proof/private.pem --public-key /tmp/eq-proof/public.pem
          eq-proof repair \
            --spec examples/portfolio_allocation/spec.json \
            --input examples/portfolio_allocation/input.json \
            --proof /tmp/eq-proof/proof.json \
            --report /tmp/eq-proof/report.md \
            --private-key /tmp/eq-proof/private.pem
          eq-proof verify /tmp/eq-proof/proof.json --public-key /tmp/eq-proof/public.pem
      - name: Exercise P6 and cost close gate
        run: |
          set +e
          eq-controls analyze \
            --p6-xer examples/hyperscale_close/schedule.xer \
            --cost-csv examples/hyperscale_close/cost.csv \
            --equations examples/hyperscale_close/custom_equations.json \
            --output /tmp/hyperscale-close \
            --currency USD
          status=$?
          set -e
          test "$status" -eq 3
          test -s /tmp/hyperscale-close/analysis.json
          test -s /tmp/hyperscale-close/exceptions.csv
          test -s /tmp/hyperscale-close/control-room.json
          grep -q 'cost.eac_identity' /tmp/hyperscale-close/exceptions.csv
          grep -q 'schedule.progress_duration' /tmp/hyperscale-close/exceptions.csv
          grep -q 'schedule.extreme_negative_float' /tmp/hyperscale-close/exceptions.csv
      - name: Verify public Control Room evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('src/eq_proof/web/demo-data.json').read_text())
          assert payload['schema_version'] == 'eq-proof/control-room@2'
          assert payload['units']['currency'] == 'USD'
          assert payload['portfolio']['reported_eac'] == 407_000_000
          assert payload['portfolio']['defensible_eac'] == 418_000_000
          assert payload['portfolio']['deterministic_forecast_gap'] == 11_000_000
          assert payload['portfolio']['configured_change_and_risk'] == 65_000_000
          assert payload['portfolio']['reconstructed_risk_adjusted_eac'] == 483_000_000
          assert payload['portfolio']['risk_adjusted_reconciliation_gap'] == 11_000_000
          assert payload['portfolio']['exposure_above_reported_eac'] == 76_000_000
          assert payload['assurance']['calibrated_probability'] is False
          assert payload['gate']['status'] == 'blocked'
          assert payload['graph']['limits']['truncated'] is False
          assert len(payload['graph']['nodes']) >= 10
          PY
