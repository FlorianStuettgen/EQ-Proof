name: repository-proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Test and measure coverage
        run: python -m pytest --cov=eq_proof --cov-report=term-missing --cov-report=xml
      - name: Compile all modules
        run: python -m compileall -q src
      - name: Verify checked-in evidence is reproducible
        run: python scripts/regenerate_evidence.py && git diff --exit-code
      - name: Exercise signed CLI workflow
        run: |
          mkdir -p /tmp/eq-proof
          eq-proof keygen --private-key /tmp/eq-proof/private.pem --public-key /tmp/eq-proof/public.pem
          eq-proof repair \
            --spec examples/portfolio_allocation/spec.json \
            --input examples/portfolio_allocation/input.json \
            --proof /tmp/eq-proof/proof.json \
            --report /tmp/eq-proof/proof.md \
            --private-key /tmp/eq-proof/private.pem
          eq-proof verify /tmp/eq-proof/proof.json --public-key /tmp/eq-proof/public.pem
