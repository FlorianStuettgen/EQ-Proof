name: reconstruct-eq-proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]' && hashFiles('.eqproof-reconstruction.b64') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository tree
        shell: bash
        run: |
          set -euo pipefail
          cp .eqproof-reconstruction.b64 /tmp/eqproof-reconstruction.b64
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          base64 -d /tmp/eqproof-reconstruction.b64 | tar -xzf - -C .

      - name: Install and test reconstructed package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest --cov=eq_proof --cov-report=term-missing
          python -m compileall -q src

      - name: Verify deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum evidence/demo-public-key.pem evidence/portfolio-allocation.proof.json evidence/portfolio-allocation.report.md > /tmp/evidence.sha256
          python scripts/regenerate_evidence.py
          sha256sum -c /tmp/evidence.sha256

      - name: Exercise signed CLI workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eq-proof
          eq-proof keygen --private-key /tmp/eq-proof/private.pem --public-key /tmp/eq-proof/public.pem
          eq-proof repair --spec examples/portfolio_allocation/spec.json --input examples/portfolio_allocation/input.json --proof /tmp/eq-proof/proof.json --report /tmp/eq-proof/report.md --private-key /tmp/eq-proof/private.pem
          eq-proof verify /tmp/eq-proof/proof.json --public-key /tmp/eq-proof/public.pem

      - name: Commit reconstruction directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruct EQ-Proof as a verified 1.0 release"
          git push origin HEAD:main
