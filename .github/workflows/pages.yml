name: Publish Control Room Demo

on:
  push:
    branches: [main]
    paths:
      - "src/eq_proof/web/**"
      - "examples/hyperscale_close/**"
      - "scripts/regenerate_control_room_demo.py"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate deployable bundle
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("src/eq_proof/web")
          required = {
              "index.html",
              "styles.css",
              "refinements.css",
              "audit.css",
              "static-bootstrap.js",
              "app.js",
              "renderers.js",
              "workflow.js",
              "showcase.js",
              "audit.js",
              "demo-data.json",
          }
          missing = sorted(name for name in required if not (root / name).is_file())
          assert not missing, f"Missing Pages assets: {missing}"

          html = (root / "index.html").read_text(encoding="utf-8")
          assert "Take the 90-second tour" in html
          assert "EQ-Proof Control Room" in html
          assert "Skip to the Control Room" in html
          assert 'id="dialogClose" type="button"' in html
          assert 'src="./static-bootstrap.js"' in html
          assert "frame-ancestors" not in html
          assert not re.search(r'(?:src|href)="/(?!/)', html), (
              "Root-relative assets break when Pages serves the project under /EQ-Proof/."
          )

          local_assets = re.findall(r'(?:src|href)="\./([^"?#]+)', html)
          missing_links = sorted(
              asset for asset in local_assets if not (root / asset).is_file()
          )
          assert not missing_links, f"Broken local asset references: {missing_links}"

          payload = json.loads((root / "demo-data.json").read_text(encoding="utf-8"))
          assert payload["schema_version"] == "eq-proof/control-room@2"
          assert payload["gate"]["status"] == "blocked"
          assert payload["portfolio"]["reported_eac"] == 407_000_000
          assert payload["portfolio"]["defensible_eac"] == 418_000_000
          assert payload["portfolio"]["exposure_above_reported_eac"] == 76_000_000
          PY

      - name: Smoke-test static bundle
        run: |
          python -m http.server 4173 --directory src/eq_proof/web >/tmp/eq-proof-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/eq-proof-index.html; then
              break
            fi
            sleep 1
          done
          grep -Fq "Take the 90-second tour" /tmp/eq-proof-index.html
          grep -Fq "Skip to the Control Room" /tmp/eq-proof-index.html
          curl --fail --silent http://127.0.0.1:4173/static-bootstrap.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/showcase.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/audit.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/audit.css >/dev/null
          curl --fail --silent http://127.0.0.1:4173/demo-data.json >/tmp/eq-proof-demo.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/eq-proof-demo.json").read_text())
          assert payload["schema_version"] == "eq-proof/control-room@2"
          PY

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload static synthetic demo
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src/eq_proof/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          outcome = os.environ.get("DEPLOY_OUTCOME", "")
          page_url = os.environ.get("PAGE_URL", "")
          state = "success" if outcome == "success" else "failure"
          description = (
              "Control Room deployed to GitHub Pages"
              if state == "success"
              else "GitHub Pages deployment failed"
          )
          payload = {
              "state": state,
              "context": "github-pages/live",
              "description": description,
          }
          if page_url:
              payload["target_url"] = page_url

          request = urllib.request.Request(
              "https://api.github.com/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "eq-proof-pages",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 201
          PY
