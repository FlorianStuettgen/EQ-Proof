name: Publish Control Room Demo

on:
  push:
    branches: [main]
    paths:
      - "src/eq_proof/web/**"
      - "examples/hyperscale_close/**"
      - "scripts/regenerate_control_room_demo.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/eq_proof/web
      - name: Deploy static synthetic demo
        id: deployment
        uses: actions/deploy-pages@v4
