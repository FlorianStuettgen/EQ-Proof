<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">EQ-Proof constraint repair and semantic verification</title>
  <desc id="desc">Declared rules and an invalid numeric output enter a minimal-change projection engine, producing a signed proof that is independently replayed and verified.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1400" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1270" cy="80" r="150" fill="#38bdf8" opacity="0.06"/>
  <circle cx="110" cy="520" r="180" fill="#a78bfa" opacity="0.06"/>

  <text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#f8fafc">EQ-PROOF</text>
  <text x="64" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#94a3b8">Constraint-governed repair · cryptographic attestation · semantic replay</text>
  <rect x="64" y="126" width="390" height="4" rx="2" fill="url(#accent)"/>

  <g filter="url(#shadow)">
    <rect x="64" y="170" width="360" height="312" rx="22" fill="#0f172a" stroke="#24324a"/>
    <rect x="520" y="170" width="360" height="312" rx="22" fill="#0f172a" stroke="#24324a"/>
    <rect x="976" y="170" width="360" height="312" rx="22" fill="#0f172a" stroke="#24324a"/>
  </g>

  <text x="94" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#38bdf8">01 · DECLARE</text>
  <text x="94" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Rules + submitted values</text>
  <text x="94" y="286" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#cbd5e1">a + b + reserve == 1</text>
  <text x="94" y="317" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#cbd5e1">reserve.fixed = true</text>
  <text x="94" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#94a3b8">Submitted total</text>
  <text x="374" y="365" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#fbbf24">110%</text>
  <rect x="94" y="384" width="280" height="14" rx="7" fill="#1e293b"/>
  <rect x="94" y="384" width="280" height="14" rx="7" fill="#f59e0b" opacity="0.75"/>
  <rect x="94" y="424" width="280" height="36" rx="10" fill="#2a1d0c" stroke="#92400e"/>
  <text x="234" y="447" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fef3c7">Constraint violation detected</text>

  <text x="550" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#a78bfa">02 · REPAIR</text>
  <text x="550" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Nearest feasible output</text>
  <circle cx="585" cy="304" r="24" fill="#312e81"/>
  <text x="585" y="311" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#ddd6fe">1</text>
  <text x="625" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#cbd5e1">Compile safe linear constraints</text>
  <line x1="585" y1="330" x2="585" y2="350" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="585" cy="376" r="24" fill="#312e81"/>
  <text x="585" y="383" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#ddd6fe">2</text>
  <text x="625" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#cbd5e1">Dykstra L2 projection</text>
  <line x1="585" y1="402" x2="585" y2="422" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="585" cy="448" r="24" fill="#312e81"/>
  <text x="585" y="455" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#ddd6fe">3</text>
  <text x="625" y="454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#cbd5e1">Fail closed unless feasible</text>

  <text x="1006" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#34d399">03 · VERIFY</text>
  <text x="1006" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Proof, then replay</text>
  <rect x="1006" y="278" width="300" height="45" rx="11" fill="#10261c" stroke="#166534"/>
  <text x="1024" y="306" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#bbf7d0">✓ Canonical SHA-256 integrity</text>
  <rect x="1006" y="337" width="300" height="45" rx="11" fill="#10261c" stroke="#166534"/>
  <text x="1024" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#bbf7d0">✓ Optional Ed25519 authenticity</text>
  <rect x="1006" y="396" width="300" height="62" rx="11" fill="#10261c" stroke="#166534"/>
  <text x="1024" y="422" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#bbf7d0">✓ Independent semantic replay</text>
  <text x="1024" y="443" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#86efac">recompute feasibility + nearest repair</text>

  <path d="M440 326 C470 326 485 326 505 326" stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M494 318 L508 326 L494 334" fill="#64748b"/>
  <path d="M896 326 C926 326 941 326 961 326" stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M950 318 L964 326 L950 334" fill="#64748b"/>
</svg>
